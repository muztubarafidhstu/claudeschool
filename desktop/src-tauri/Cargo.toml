[package]
name = "scholardesk-pro"
version = "1.0.0"
description = "ScholarDesk Pro — offline-first school management"
authors = ["ScholarDesk"]
edition = "2021"

[lib]
name = "scholardesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
jsonwebtoken = "9"
machine-uid = "0.5"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
