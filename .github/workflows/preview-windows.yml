# Builds an unsigned Windows installer. Download it from the run's "Artifacts" section.
#  * Automatic runs (push) and "preview" runs: license checks disabled (VITE_PREVIEW_BUILD=1) — for trying the app.
#  * Manual run with mode = "licensed": the real customer build, activated & controlled from https://school.rafid0.com
name: Windows installer
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = no license (testing) · licensed = real customer build (needs school.rafid0.com online)'
        type: choice
        options: [preview, licensed]
        default: preview
  push:
    branches: [main, scholardesk-pro-v1]
    paths: ['desktop/**', '.github/workflows/preview-windows.yml']
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }
      - run: npm ci
      - name: Build installer
        env:
          VITE_PREVIEW_BUILD: ${{ inputs.mode == 'licensed' && '0' || '1' }}
          VITE_LICENSE_API: https://school.rafid0.com/api/v1
          SD_EMERGENCY_SECRET: ${{ secrets.SD_EMERGENCY_SECRET }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        run: npx tauri build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ScholarDesk-Pro-${{ inputs.mode == 'licensed' && 'Licensed' || 'Preview' }}-Windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
